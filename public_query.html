{% extends "base.html" %}
{% block title %}Consulta Pública - AMAJG{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto py-8">
    <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 border border-slate-100 mb-8">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Consulta Pública de Voluntário</h2>
            <p class="text-sm text-slate-600 mt-1">Digite o código único da carteirinha para validar as informações na AMAJG.</p>
        </div>
        <form method="POST" class="flex flex-col sm:flex-row gap-3">
            <div class="relative flex-grow">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-barcode"></i></span>
                <input type="text" name="code" value="{{ query_code }}" required placeholder="Ex: AMAJG-12345" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-600 font-mono uppercase text-sm">
            </div>
            <button type="submit" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-6 py-3 rounded-xl shadow transition flex items-center justify-center">
                <i class="fas fa-search mr-2"></i> Consultar
            </button>
        </form>
    </div>
</div>
{% endblock %}
