{% extends "base.html" %}
{% block title %}Login Administrador - AMAJG{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden my-8 border border-slate-100">
    <div class="bg-emerald-800 text-white py-6 px-8 text-center">
        <h2 class="text-2xl font-bold">Área Administrativa</h2>
        <p class="text-xs text-emerald-200 mt-1">Gestão de Voluntários AMAJG</p>
    </div>
    <form method="POST" class="p-8 space-y-6">
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">E-mail de Acesso</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" required placeholder="cadastro.amajg@gmail.com" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
            </div>
        </div>
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Senha</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-lock"></i></span>
                <input type="password" id="password" name="password" required placeholder="Sua senha" class="w-full pl-10 pr-12 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
                <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                    <i id="eyeIcon" class="fas fa-eye"></i>
                </button>
            </div>
        </div>
        <div class="flex items-center justify-between text-sm">
            <a href="{{ url_for('forgot_password') }}" class="text-emerald-700 hover:underline font-medium">Esqueci minha senha</a>
        </div>
        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-lg shadow transition flex items-center justify-center">
            <i class="fas fa-sign-in-alt mr-2"></i> Entrar
        </button>
    </form>
    <div class="bg-slate-50 px-8 py-4 border-t border-slate-100 text-center text-xs text-slate-500">
        Credencial principal padrão: <code class="bg-slate-200 px-1 py-0.5 rounded text-slate-700 font-semibold">cadastro.amajg@gmail.com</code>
    </div>
</div>

<script>
function togglePassword() {
    const pwd = document.getElementById('password');
    const eye = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
    } else {
        pwd.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
