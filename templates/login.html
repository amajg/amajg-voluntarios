{% extends "base.html" %}
{% block title %}Login - AMAJG{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-12 bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
    <div class="bg-emerald-800 text-white py-4 px-6 text-center">
        <h2 class="text-lg font-bold">Área Administrativa</h2>
        <p class="text-xs text-emerald-200">Gestão de Voluntários AMAJG</p>
    </div>
    <form action="{{ url_for('login') }}" method="POST" class="p-6 space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">E-mail Principal ou Nome da Diretoria</label>
            <input type="text" name="email" required placeholder="ex: cadastro.amajg@gmail.com ou cecilia" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none">
            <p class="text-[11px] text-slate-400 mt-1">Diretoria: cecilia, douglas, adrielle, mendes</p>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
            <div class="relative">
                <input type="password" id="password-input" name="password" required class="w-full rounded-lg border border-slate-300 px-3 py-2 pr-10 text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none">
                <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 text-sm focus:outline-none">
                    <i id="eye-icon" class="fas fa-eye"></i>
                </button>
            </div>
        </div>
        <div class="flex items-center justify-between text-xs">
            <a href="{{ url_for('forgot_password') }}" class="text-emerald-700 hover:underline">Esqueci minha senha</a>
        </div>
        <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-lg text-sm transition shadow">
            <i class="fas fa-sign-in-alt mr-2"></i> Entrar
        </button>
    </form>
</div>
<script>
function togglePassword() {
    const input = document.getElementById('password-input');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
