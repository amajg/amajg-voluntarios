{% extends "base.html" %}
{% block title %}Recuperar Senha - AMAJG{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden my-8 border border-slate-100">
    <div class="bg-amber-600 text-white py-6 px-8 text-center">
        <h2 class="text-2xl font-bold">Recuperação de Senha</h2>
        <p class="text-xs text-amber-100 mt-1">Geração de Senha Temporária</p>
    </div>
    <form method="POST" class="p-8 space-y-6">
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">E-mail Cadastrado</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" required placeholder="cadastro.amajg@gmail.com" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
            </div>
            <p class="text-xs text-slate-500 mt-2">Uma nova senha temporária será gerada instantaneamente para seu acesso.</p>
        </div>
        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-lg shadow transition flex items-center justify-center">
            <i class="fas fa-key mr-2"></i> Gerar Senha Temporária
        </button>
        <div class="text-center">
            <a href="{{ url_for('login') }}" class="text-sm text-slate-600 hover:underline"><i class="fas fa-arrow-left mr-1"></i> Voltar ao Login</a>
        </div>
    </form>
</div>
{% endblock %}
